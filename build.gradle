plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	// Modrinth / Shedaniel(cloth-config) / Terraformers(modmenu)
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { url "https://maven.shedaniel.me/" }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

// 全局 init 脚本(neoforge-mirror.gradle)会给所有项目注入 maven.neoforged.net /
// maven.minecraftforge.net 仓库。当前网络环境下访问这两个仓库会 Connection
// reset，导致 Gradle 中断整个依赖解析（即使后续仓库存在正确的 artifact）。
// 此处将其移除，只保留本项目显式声明的仓库。
allprojects { p ->
	p.repositories.removeIf { repo ->
		try {
			def url = repo.url
			url != null && (url.toString().contains('neoforged') || url.toString().contains('minecraftforge'))
		} catch (Exception e) {
			false
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// 原作者编写的 bili-live-danmu 直播弹幕库
	implementation project(':bili-live-danmu')
	include(project(":bili-live-danmu"))
	include "org.java-websocket:Java-WebSocket:1.5.7"
	include "org.brotli:dec:0.1.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Keep the included library's published variant compatible with this mod's Java runtime.
project(':bili-live-danmu') {
	plugins.withId('java-library') {
		java {
			sourceCompatibility = JavaVersion.VERSION_17
			targetCompatibility = JavaVersion.VERSION_17
		}
		tasks.withType(JavaCompile).configureEach {
			options.release.set(17)
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
